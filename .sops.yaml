# SOPS: правила шифрования секретов в репозитории.
# Зашифрованы файлы helm/secrets/*.yaml (только блок `secrets`).
# Приватный age-ключ — НЕ в git: ~/.config/sops/age/keys.txt (локально)
# и GitHub Secret SOPS_AGE_KEY (CI/CD). Публичный ключ ниже — в git безопасно.
creation_rules:
  - path_regex: helm/secrets/.*\.yaml$
    encrypted_regex: '^(secrets)$'
    age: age14l2l8qc9yhnzafpn2qq8f8y9tu8dq45drgyqlmh8dc0alnm579gsh93nfy
