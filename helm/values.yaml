# Registry с образами. При переносе репозитория на новый GitHub замените
# на ghcr.io/<новый-org>/<новый-repo> или переопределите в CI:
#   --set registry=ghcr.io/${{ github.repository }}
# Для локальной разработки: --set registry=localhost:5000/full-proj
registry: ghcr.io/YOUR_ORG/YOUR_REPO
image:
  tag: latest

namespace: full-proj

backend:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  port: 9000
  env:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: laravel_dev
    DB_USERNAME: laravel
    # Разрешённые Origin для CORS: фронтенд теперь за тем же Gateway :30080
    CORS_ALLOWED_ORIGINS: "http://localhost:30080"

frontend:
  replicas: 1
  port: 3000
  # Внешнего NodePort нет: фронтенд доступен ТОЛЬКО через Gateway API :30080 -> WAF
  # (вариант A). NEXT_PUBLIC_API_URL вшивается при сборке образа.
  apiUrl: "http://localhost:30080"
  # Внутрикластерный адрес для SSR-запросов (server components): из пода
  # localhost:30080 недоступен — сервер ходит напрямую в Service waf (вариант A).
  internalApiUrl: "http://waf.full-proj.svc.cluster.local:8080"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "500m"

nginx:
  replicas: 1
  port: 80

mysql:
  replicas: 1
  port: 3306
  database: laravel_dev
  storage: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

# WAF: ModSecurity + OWASP CRS (nginx-alpine). Единственная точка входа
# на бэкенд: Gateway API -> HTTPRoute -> Service waf -> Service nginx -> backend.
waf:
  replicas: 1
  # Образ по умолчанию — публичный owasp/modsecurity-crs:nginx-alpine.
  # Для локального registry: --set waf.image=localhost:5000/full-proj/waf:latest
  image: owasp/modsecurity-crs:nginx-alpine
  port: 8080
  backendService: "nginx"
  backendPort: 80
  # Фронтенд тоже за WAF (вариант A: единая точка входа, роутинг по path)
  frontendService: "frontend"
  frontendPort: 3000
  serverName: "localhost"
  # Пробрасывать оригинальный Host (с портом) и оригинальный порт клиента.
  # nginx $host режет порт, а $server_port WAF = 8080, из-за чего приложение
  # генерировало URL вида http://localhost:8080 (неверно при доступе через Gateway).
  proxyHostHeader: "$http_host"
  nginxForwardedPort: "$http_x_forwarded_port"
  # ModSecurity: On = блокирующий режим; DetectionOnly = только логировать
  modsecRuleEngine: "On"
  paranoia: "1"
  anomalyInbound: "5"
  anomalyOutbound: "4"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Gateway API: Gateway + HTTPRoute (GatewayClass создаётся отдельно:
# infra/gateway-api/gatewayclass.yaml)
gateway:
  name: full-proj-gateway
  className: traefik
  listenerPort: 80

secrets:
  APP_KEY: ""
  DB_PASSWORD: ""
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""
  TO_EMAIL: ""
  DB_ROOT_PASSWORD: ""
  APP_URL: ""
