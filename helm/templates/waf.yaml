{{- /* WAF: ModSecurity + OWASP CRS (nginx-alpine). Источник конфигов: waf/ в корне репозитория. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-custom-rules
  namespace: {{ .Values.namespace }}
data:
  # Содержимое повторяет waf/rules/custom-waf.conf (имя файла обеспечивает
  # загрузку ДО OWASP CRS: "REQUEST-899" сортируется раньше "REQUEST-901...").
  REQUEST-899-CUSTOM-WAF.conf: |
    SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /opt/owasp-crs/rules/scanners-botnets.data" \
        "id:1000001,\
        phase:1,\
        t:lowercase,\
        deny,\
        status:403,\
        log,\
        msg:'Blocked: known vulnerability scanner / botnet User-Agent',\
        severity:'CRITICAL',\
        tag:'custom-waf',\
        tag:'scanner-detection',\
        ver:'lab-custom-rules/1.0'"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-scanners-data
  namespace: {{ .Values.namespace }}
data:
  # Содержимое повторяет waf/rules/scanners-botnets.data (шаблоны в нижнем регистре)
  scanners-botnets.data: |
    nikto
    sqlmap
    sqlninja
    jsql
    xsser
    nmap
    nmap scripting engine
    masscan
    zmap
    zgrab
    w3af
    skipfish
    grabber
    commix
    arachni
    whatweb
    wpscan
    joomscan
    droopescan
    dirbuster
    dirb
    gobuster
    feroxbuster
    wfuzz
    ffuf
    nuclei
    jaeles
    xray
    openvas
    nessus
    acunetix
    netsparker
    qualys
    appscan
    burpcollaborator
    censysinspect
    shodan
    internetmeasurement
    netsystemsresearch
    paloalto
    zmeu
    morfeus
    mirai
    hakai
    tsunami
    kaiten
    gafgyt
    bashlite
    qbot
    brickerbot
    iot_reaper
    satori
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-nginx-template
  namespace: {{ .Values.namespace }}
data:
  # Единая точка входа (вариант A): WAF инспектирует ВЕСЬ трафик и сам
  # маршрутизирует по пути: /api, /admin, /storage, /sanctum, /livewire, /filament
  # -> бэкенд (nginx+Laravel), всё остальное (включая /api/contact) -> фронтенд.
  # Первое совпадение в map побеждает. limit_req на статику -> HTTP 429.
  default.conf.template: |
    limit_req_zone $binary_remote_addr zone=static_per_ip:10m rate=30r/s;

    server_tokens ${SERVER_TOKENS};

    more_set_headers 'Server: ${SERVER_HEADER}';

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Выбор upstream по пути (первое совпадение побеждает).
    # По умолчанию весь трафик идёт на фронтенд — он тоже за WAF.
    # Ассеты админки (/css, /js, /vendor, /storage) отдаёт Laravel.
    map $uri $waf_upstream {
        default        ${FRONTEND_BACKEND};
        ~^/api/contact ${FRONTEND_BACKEND};
        ~^/api/        ${BACKEND};
        ~^/admin       ${BACKEND};
        ~^/storage/    ${BACKEND};
        ~^/sanctum/    ${BACKEND};
        ~^/livewire/   ${BACKEND};
        ~^/filament/   ${BACKEND};
        ~^/css/        ${BACKEND};
        ~^/js/         ${BACKEND};
        ~^/vendor/     ${BACKEND};
    }

    # resolver уже задан образом в http-контексте (91-update-resolver.sh
    # берёт nameserver из /etc/resolv.conf — в k8s это CoreDNS).

    server {
        listen ${PORT} default_server;

        server_name ${SERVER_NAME};
        set $always_redirect ${NGINX_ALWAYS_TLS_REDIRECT};

        PROXY_SSL_CONFIG

        # Статика любого приложения: рейт-лимит + роутинг по map
        location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|svg|webp|avif|ico|bmp|woff2?|ttf|eot|otf|mp4|webm|ogg|mp3|pdf)$ {
            limit_req zone=static_per_ip burst=60 nodelay;
            limit_req_status 429;
            limit_req_log_level warn;
            proxy_http_version 1.1;
            proxy_set_header Host ${PROXY_HOST_HEADER};
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto ${NGINX_X_FORWARDED_PROTO};
            proxy_set_header X-Forwarded-Port ${NGINX_X_FORWARDED_PORT};
            proxy_pass $waf_upstream;
        }

        location / {
            client_max_body_size 0;

            if ($always_redirect = on) {
                return 301 https://$host$request_uri;
            }

            proxy_http_version 1.1;
            proxy_set_header Host ${PROXY_HOST_HEADER};
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto ${NGINX_X_FORWARDED_PROTO};
            proxy_set_header X-Forwarded-Port ${NGINX_X_FORWARDED_PORT};
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 36000s;
            proxy_pass $waf_upstream;
        }

        # /healthz, /metrics/nginx (stub_status) и 50x-страница из образа
        include includes/location_common.conf;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.waf.replicas }}
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      containers:
        - name: modsecurity-waf
          image: {{ .Values.waf.image }}
          ports:
            - containerPort: {{ .Values.waf.port }}
          resources:
            requests:
              memory: {{ .Values.waf.resources.requests.memory }}
              cpu: {{ .Values.waf.resources.requests.cpu }}
            limits:
              memory: {{ .Values.waf.resources.limits.memory }}
              cpu: {{ .Values.waf.resources.limits.cpu }}
          env:
            # FQDN обязателен: переменный proxy_pass резолвится через nginx resolver,
            # который не раскрывает search-домены из resolv.conf.
            - name: BACKEND
              value: "http://{{ .Values.waf.backendService }}.{{ $.Values.namespace }}.svc.cluster.local:{{ .Values.waf.backendPort }}"
            - name: FRONTEND_BACKEND
              value: "http://{{ .Values.waf.frontendService }}.{{ $.Values.namespace }}.svc.cluster.local:{{ .Values.waf.frontendPort }}"
            - name: PORT
              value: {{ .Values.waf.port | quote }}
            - name: SERVER_NAME
              value: {{ .Values.waf.serverName }}
            # Не подменять Host/порт на собственные (см. waf.proxyHostHeader в values)
            - name: PROXY_HOST_HEADER
              value: {{ .Values.waf.proxyHostHeader | quote }}
            - name: NGINX_X_FORWARDED_PORT
              value: {{ .Values.waf.nginxForwardedPort | quote }}
            # ModSecurity: On (блокирующий режим) / DetectionOnly (только логи)
            - name: MODSEC_RULE_ENGINE
              value: {{ .Values.waf.modsecRuleEngine | quote }}
            - name: PARANOIA
              value: {{ .Values.waf.paranoia | quote }}
            - name: DETECTION_PARANOIA
              value: {{ .Values.waf.paranoia | quote }}
            - name: BLOCKING_PARANOIA
              value: {{ .Values.waf.paranoia | quote }}
            - name: ANOMALY_INBOUND
              value: {{ .Values.waf.anomalyInbound | quote }}
            - name: ANOMALY_OUTBOUND
              value: {{ .Values.waf.anomalyOutbound | quote }}
            # Audit-лог (JSON) в stdout -> kubectl logs
            - name: MODSEC_AUDIT_ENGINE
              value: "RelevantOnly"
            - name: MODSEC_AUDIT_LOG
              value: "/dev/stdout"
            - name: MODSEC_AUDIT_LOG_FORMAT
              value: "JSON"
            - name: MODSEC_AUDIT_LOG_RELEVANT_STATUS
              value: "^(?:5|4(?!04))"
            - name: MODSEC_REQ_BODY_LIMIT
              value: "104857600"
            - name: MODSEC_REQ_BODY_NOFILES_LIMIT
              value: "104857600"
          volumeMounts:
            - name: custom-rules
              mountPath: /opt/owasp-crs/rules/REQUEST-899-CUSTOM-WAF.conf
              subPath: REQUEST-899-CUSTOM-WAF.conf
            - name: scanners-data
              mountPath: /opt/owasp-crs/rules/scanners-botnets.data
              subPath: scanners-botnets.data
            - name: nginx-template
              mountPath: /etc/nginx/templates/conf.d/default.conf.template
              subPath: default.conf.template
      volumes:
        - name: custom-rules
          configMap:
            name: waf-custom-rules
        - name: scanners-data
          configMap:
            name: waf-scanners-data
        - name: nginx-template
          configMap:
            name: waf-nginx-template
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: waf
  ports:
    - port: {{ .Values.waf.port }}
      targetPort: {{ .Values.waf.port }}
