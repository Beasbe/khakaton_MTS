apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
        listen 80;
        root /var/www/html/public;
        index index.php index.html;

        # Метрики для nginx-prometheus-exporter (sidecar в этом же поде)
        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass localhost:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_HOST $host;
            include fastcgi_params;
            # TLS терминируется на Gateway (Traefik) — до бэкенда трафик доходит
            # по HTTP. Пробрасываем X-Forwarded-* в php-fpm, чтобы Laravel
            # (TrustProxies '*') генерировал корректные https-URL (редиректы
            # /admin -> /admin/login, ссылки на /storage и т.д.).
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTPS $http_x_forwarded_proto;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires max;
            log_not_found off;
            try_files $uri =404;
        }
    }
