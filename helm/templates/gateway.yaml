{{- /* Доступ к приложению через Kubernetes Gateway API.
     GatewayClass — cluster-scoped, создаётся отдельно (infra/gateway-api/gatewayclass.yaml). */ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
    # HTTPS: TLS-termination на Traefik (самоподписанный сертификат из Secret
    # full-proj-tls, создаётся scripts/gen-cert.sh). WAF за Gateway продолжает
    # работать по HTTP — инспектируется весь трафик.
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.httpsListenerPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.gateway.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: full-proj-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
    # Тот же маршрут прикреплён и к HTTPS-listener'у (TLS-terminate на Gateway)
    - name: {{ .Values.gateway.name }}
      sectionName: https
  rules:
    # Весь HTTP-трафик -> Service waf (WAF - обязательная точка входа),
    # далее WAF реверс-проксирует на Service nginx -> php-fpm.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: waf
          port: {{ .Values.waf.port }}
