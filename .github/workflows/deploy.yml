name: CD (deploy)

# CD (развёртывание) — запускается вручную: требует self-hosted runner
# с доступом к кластеру (см. MIGRATION.md). CI (сборка образов в GHCR)
# — в ci.yml, автоматически на push/PR.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # self-hosted runner (Ubuntu 24.04 с docker/kubectl/helm).
    # Имя можно переопределить репозиторной переменной RUNNER_LABEL
    # (при переносе на новый GitHub — настройте runner и переменные, см. MIGRATION.md).
    runs-on: ${{ vars.RUNNER_LABEL || 'server' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR требует lowercase-пути репозитория (khakaton_MTS -> khakaton_mts)
      - name: Compute lowercase repository path
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      ########################################
      # BUILD IMAGES
      ########################################

      - name: Build Backend
        run: |
          docker build \
            --network host \
            -t ghcr.io/${{ steps.repo.outputs.lower }}/backend:${{ github.sha }} \
            -t ghcr.io/${{ steps.repo.outputs.lower }}/backend:latest \
            ./CMS

      - name: Push Backend
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.lower }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.repo.outputs.lower }}/backend:latest

      - name: Build Frontend
        run: |
          docker build \
            --network host \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '' }} \
            -t ghcr.io/${{ steps.repo.outputs.lower }}/frontend:${{ github.sha }} \
            -t ghcr.io/${{ steps.repo.outputs.lower }}/frontend:latest \
            ./It_project

      - name: Push Frontend
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.lower }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ steps.repo.outputs.lower }}/frontend:latest

      ########################################
      # UNLOCK HELM
      ########################################

      - name: Unlock stuck Helm release
        run: |
          STATUS=$(helm status full-proj -n full-proj 2>/dev/null | grep STATUS: | awk '{print $2}' || true)

          if [[ "$STATUS" == pending-* ]]; then
            echo "Helm release is stuck: $STATUS"

            kubectl delete secret -n full-proj \
              $(kubectl get secret -n full-proj -o name | grep sh.helm.release || true) \
              || true
          fi

      ########################################
      # SECRETS (SOPS)
      ########################################

      - name: Install sops + age
        run: |
          sudo curl -sL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          curl -sL -o /tmp/age.tar.gz \
            https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          sudo tar -xzf /tmp/age.tar.gz -C /usr/local/bin --strip-components=1 age/age age/age-keygen

      - name: Decrypt secrets (helm/secrets/dev.yaml)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops -d helm/secrets/dev.yaml > /tmp/dev-secrets.yaml

      ########################################
      # DEPLOY
      ########################################

      - name: Helm Deploy
        run: |
          helm upgrade --install full-proj ./helm \
            --namespace full-proj \
            --create-namespace \
            --history-max 3 \
            --timeout 15m \
            --set image.tag=${{ github.sha }} \
            --set registry=ghcr.io/${{ steps.repo.outputs.lower }} \
            -f /tmp/dev-secrets.yaml
          rm -f /tmp/dev-secrets.yaml

      ########################################
      # WAIT
      ########################################

      - name: Wait MySQL
        run: |
          kubectl rollout status deployment/mysql -n full-proj --timeout=300s

      - name: Wait Backend
        run: |
          kubectl rollout status deployment/backend -n full-proj --timeout=300s

      - name: Wait Frontend
        run: |
          kubectl rollout status deployment/frontend -n full-proj --timeout=300s

      ########################################
      # MIGRATIONS
      ########################################

      ########################################
      # DEBUG
      ########################################

      - name: Debug on failure
        if: failure()
        run: |
          echo "========== PODS =========="
          kubectl get pods -n full-proj -o wide

          echo
          echo "========== DEPLOYMENTS =========="
          kubectl get deploy -n full-proj

          echo
          echo "========== EVENTS =========="
          kubectl get events -n full-proj --sort-by=.lastTimestamp

          echo
          echo "========== DESCRIBE =========="
          for p in $(kubectl get pods -n full-proj -o name); do
            echo "----- $p -----"
            kubectl describe $p -n full-proj
          done

          echo
          echo "========== LOGS =========="
          for p in $(kubectl get pods -n full-proj -o name); do
            echo "----- $p -----"
            kubectl logs $p -n full-proj --all-containers=true --tail=100 || true
          done

      ########################################
      # CLEANUP
      ########################################

      - name: Cleanup Docker
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true
