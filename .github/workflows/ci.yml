name: CI

# Непрерывная интеграция: сборка образов приложения и публикация в GHCR.
# Запускается автоматически на push в main и на PR (PR — только сборка,
# без публикации). CD — отдельный workflow deploy.yml (workflow_dispatch,
# self-hosted runner): развёртывание выполняет принимающая сторона.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Helm lint (чарт приложения)
        run: helm lint helm

  # DevSecOps: сканирование секретов во всей истории (gitleaks)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (полная история)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — поиск секретов/утечек
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [checks, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR требует lowercase-пути репозитория (khakaton_MTS -> khakaton_mts)
      - name: Compute lowercase repository path
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Публикуем только на push в main / ручной запуск; в PR образы
      # собираются без push — это проверка, что сборка проходит.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./CMS
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}/backend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.lower }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./It_project
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}/frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.lower }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
