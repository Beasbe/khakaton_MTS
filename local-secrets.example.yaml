# Шаблон секретов для локального развёртывания (НЕ КОММИТИТЬ!).
# Скопируйте в local-secrets.yaml и заполните значения.
#   cp local-secrets.example.yaml local-secrets.yaml
# Файл local-secrets.yaml добавлен в .gitignore.
secrets:
  # APP_KEY: сгенерируйте и вставьте готовый ключ:
  #   echo "base64:$(openssl rand -base64 32)"
  #   # или: docker run --rm php:8.3-cli php -r 'echo "base64:".base64_encode(random_bytes(32)), PHP_EOL;'
  APP_KEY: "base64:CHANGE_ME"
  DB_PASSWORD: "local-db-password"
  DB_ROOT_PASSWORD: "local-db-root-password"
  APP_URL: "http://localhost:30080"
  # SMTP для формы контактов (опционально для локальной проверки)
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""
  TO_EMAIL: ""
